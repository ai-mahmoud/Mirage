[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is intentionally left unset here — migrations/env.py reads
# the real URL from BACKEND_DATABASE_URL (mirage_backend.config), the same
# env var the app itself uses, so migrations always target whatever
# database the app would connect to.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
